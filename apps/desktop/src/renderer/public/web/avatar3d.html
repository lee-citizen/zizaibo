function disposeProduct(p){p.disposed=true;p.g.removeFromParent();p.g.traverse(o=>{if(o.isMesh||o.isLineSegments){o.geometry.dispose();if(o.material.map&&o.material.map!==wood&&o.material.map!==grain)o.material.map.dispose();o.material.dispose()}})}
function next(){if(paused||busy||!queue.length)return;busy=true;active=queue.shift();currentProduct=createProduct(active);currentProduct.factor=active.size==='large'?1.35:1;currentProduct.g.scale.setScalar(currentProduct.factor);currentProduct.g.position.y=.57*(1-currentProduct.factor);prepareFilament(currentProduct);machineAudio.cue('start');giftSpeech.printing(active.name);phase='printing';elapsed=0;renderQueue();$('currentName').textContent=active.name;$('currentImg').src=active.avatar||fallbackAvatar(active.name);$('score').textContent='打印中';updateScreen()}
let renderFps=0;
const targetFps=60;
function syncVisualPreset(){}
function resizeRenderSurface(){sceneOutput.configure(720,1280,qualityLevel,aaMode,renderScaleLimit);}
function resize(){camera.aspect=9/16;camera.updateProjectionMatrix();resizeRenderSurface();}
window.addEventListener('resize',resize);
function measureRender(){}
function requestSceneFrame(callback){requestAnimationFrame(callback)}
// Accelerated FDM preview: discrete layers, perimeter toolpath and deposited filament.
let simulationSpeed=38;const printDuration=12,layerCount=72;
function layerPath(layer){let y=.58+(layer+1)/layerCount*1.85;let halfWidth,front,back;
if(y<.73){halfWidth=.84;front=.4;back=-.42}else if(y<1.18){halfWidth=.74;front=.25;back=-.3}else{halfWidth=Math.sqrt(Math.max(.0001,.69*.69-(y-1.7)*(y-1.7)));front=-.015;back=-.24}
const corners=[[-halfWidth,front],[halfWidth,front],[halfWidth,back],[-halfWidth,back],[-halfWidth,front]];let points=[];
for(let i=0;i<4;i++){let a=corners[i],b=corners[i+1];for(let n=0;n<24;n++){let f=n/24;points.push(new THREE.Vector3(.25+a[0]+(b[0]-a[0])*f,y,-.05+a[1]+(b[1]-a[1])*f))}}
points.push(points[0].clone());return points}
function prepareFilament(p){let points=[];p.paths=[];for(let layer=0;layer<layerCount;layer++){let path=layerPath(layer);p.paths.push(path);for(let i=0;i<path.length-1;i++){points.push(path[i].x-.25,path[i].y,path[i].z+.05,path[i+1].x-.25,path[i+1].y,path[i+1].z+.05)}}let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(points,3));geo.setDrawRange(0,0);let line=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0xb9b4a6,transparent:true,opacity:.48}));p.g.add(line);p.filament=line;
p.bead=mesh(new THREE.SphereGeometry(.018,12,8),new THREE.MeshStandardMaterial({color:0xe8dfcd,roughness:.7}),p.g);p.bead.scale.set(1,.5,1)}
function updateDeposition(f){let step=Math.min(layerCount-.0001,f*layerCount),layer=Math.floor(step),fraction=step-layer;let path=currentProduct.paths[layer],index=fraction*(path.length-1),i=Math.floor(index);let pos=path[i].clone().lerp(path[Math.min(i+1,path.length-1)],index-i);currentProduct.plane.constant=currentProduct.g.position.y+(.58+layer/layerCount*1.85)*currentProduct.factor;
currentProduct.filament.geometry.setDrawRange(0,(layer*96+Math.floor(index))*2);currentProduct.bead.position.set(pos.x-.25,pos.y,pos.z+.05);gantry.position.y=currentProduct.g.position.y+pos.y*currentProduct.factor+.715;head.position.x=.25+(pos.x-.25)*currentProduct.factor;head.position.z=-.05+(pos.z+.05)*currentProduct.factor-.04;fan.rotation.z+=.5;}
function updateEffects(dt){if(!fxEnabled)return;const all=new Set(products);if(currentProduct)all.add(currentProduct);for(const p of all){if(p.glintAge===null||!p.glint)continue;if(!paused)p.glintAge+=dt;const f=Math.min(p.glintAge/1.15,1);p.glint.visible=f<1;p.glint.material.uniforms.sweep.value=-1.45+f*2.9;p.glint.material.uniforms.strength.value=Math.sin(Math.PI*f);if(f>=1){p.glintAge=null;p.glint.visible=false}}}
let lastGlintTime=performance.now();
let animScheduled=false;function requestAnimate(){if(animScheduled)return;animScheduled=true;requestSceneFrame(t=>{animScheduled=false;animate(t)})}
window.printerDiagnostics=()=>({camera:camera.position.toArray(),target:controls.target.toArray(),fps:renderFps,output:[renderer.domElement.width,renderer.domElement.height],internal:[sceneOutput.target.width,sceneOutput.target.height],samples:sceneOutput.samples,aa:aaMode,rendererCount:document.querySelectorAll('#stage canvas').length});
let nextRenderAt=0;function animate(now){requestAnimate();if(now+0.5<nextRenderAt)return;const frameInterval=1000/targetFps;nextRenderAt=Math.max(nextRenderAt+frameInterval,now);let dt=Math.min((now-last)/1000,.25)*simulationSpeed;last=now;if(!paused){beltOffset+=dt*beltSpeed;beltTexture.offset.x-=dt*beltSpeed/beltLength;rollers.forEach(r=>r.rotation.z-=dt*beltSpeed/.18);beltLines.forEach((b,i)=>b.position.x=beltStart+(i*beltLength/84+beltOffset)%beltLength);for(let i=products.length-1;i>=0;i--){let p=products[i];p.g.position.x+=dt*beltSpeed;if(p.g.position.x+.875*p.factor>=beltEnd-.15){disposeProduct(p);products.splice(i,1)}}if(busy){elapsed+=dt;if(phase==='printing'){let f=Math.min(elapsed/printDuration,1);updateDeposition(f);const pct=Math.round(f*100);if(pct!==lastPct){lastPct=pct;const pp=$('print-progress');if(pp)pp.textContent='当前：'+active.name+' · 打印中 '+pct+'%'}if(f===1){machineAudio.cue('complete');giftSpeech.printing(active.name,true);currentProduct.glintAge=0;phase='reveal';elapsed=0;currentProduct.plane.constant=100;currentProduct.bead.visible=false;currentProduct.filament.geometry.setDrawRange(0,Infinity);recordCompletion(active);logPrint(active);const pp=$('print-progress');if(pp)pp.textContent='当前：'+active.name+' · 出分 '+active.score+'分';$('score').innerHTML=active.score+' <small>分</small>';updateScreen()}}else if(phase==='reveal'){gantry.position.y=THREE.MathUtils.lerp(gantry.position.y,4.8,1-Math.exp(-dt*8));if(elapsed>.55){machineAudio.cue('transfer');phase='transfer';elapsed=0;beginTransfer()}}else if(phase==='transfer'){runTransfer(elapsed)}}}if(!busy&&!paused)next();updateHoses();machineAudio.update({phase,paused,elapsed,beltSpeed});updateEffects(Math.min((now-lastGlintTime)/1000,.05));lastGlintTime=now;controls.update();sceneOutput.render(scene,camera);measureRender(now);}

import {expandTask,insertTasks} from './task-adapter.mjs';

// Electron 直接调用入口：window.enqueuePrint({nickname, avatarUrl, event, count, size})
// 与 avatar2d.html 保持一致的 API，由主进程 executeJavaScript 调用
window.enqueuePrint=async({nickname,avatarUrl,event='entry',count=1,size=event==='entry'?1:2})=>{
 if(!['entry','follow','gift','like','comment'].includes(event))throw Error('不支持的事件');
 if(!nickname||!avatarUrl)throw Error('缺少昵称或头像');
 const imgData=await loadAvatar(avatarUrl);
 const jobs=expandTask({id:'ipc-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),nickname,avatarUrl:imgData,event,count,size});
 insertTasks(queue,jobs);
 renderQueue();updateScreen();next();
 return true;
};

const token=location.hash.slice(1)||sessionStorage.getItem('avatar-printer-token')||'';
if(location.hash){sessionStorage.setItem('avatar-printer-token',token);history.replaceState(null,'',location.pathname);}
const runId=crypto.randomUUID(),seen=new Set(),completions=new Set();
let reporting=false,polling=false;
async function api(path,method='GET'){
 const r=await fetch(path,{method,headers:{'X-Printer-Token':token},cache:'no-store'});
 if(!r.ok)throw Error(r.status===403?'连接凭据失效，请关闭本程序并重新启动':'接口错误 '+r.status);
 return r.json();
}
function renderQueue(){
 $('waiting').textContent=queue.length+(busy&&phase==='printing'?1:0)+serverWaiting;
 $('queue').replaceChildren();
 for(const task of queue.slice(0,8)){
  const row=document.createElement('div');row.className='item';
  const img=document.createElement('img');img.src=task.avatar;
  const text=document.createElement('span');text.textContent=task.name+' · '+(task.size==='large'?'大头像':'小头像')+' '+task.copy+'/'+task.total+(task.priority?' · 礼物优先':'');
  row.append(img,text);$('queue').append(row);
 }
 if(!queue.length)$('queue').textContent='等待任务';
}
function logPrint(task){
 records.unshift(task);if(records.length>100)records.pop();
 $('print-history').replaceChildren();
 for(const rec of records){const row=document.createElement('div');row.className='entry';row.textContent=rec.name+' · '+rec.source+' · '+rec.score+'分';$('print-history').append(row);}
}
function localDay(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function recordCompletion(task){
 if(task.demo){renderQueue();return;}
 completions.add(runId+':'+task.completionKey);flushCompletions();renderQueue();
}
async function flushCompletions(){
 if(reporting||!completions.size)return;reporting=true;
 try{
  for(const key of completions){
   completions.delete(key);
   if(token){
    const result=await api('/api/completed?key='+encodeURIComponent(key),'POST');
    count=result.count;
   }else{
    // Electron 直连模式：本地按日计数并持久化
    const day=localDay();
    const savedDay=localStorage.getItem('avatar3d-count-day');
    if(savedDay!==day){count=0;localStorage.setItem('avatar3d-count-day',day);}
    count++;
    try{localStorage.setItem('avatar3d-count-'+day,String(count));}catch(_){}
   }
   $('count').textContent=count;updateScreen();
  }
 }catch(e){$('status').textContent='业绩保存待重试：'+e.message;}finally{reporting=false;}
}
const imageCache=new Map();
function loadAvatar(url){
 if(imageCache.has(url))return imageCache.get(url);
 async function candidate(url){
  // Electron 打印窗口已禁用 webSecurity，可直接加载跨域图片并绘制到 canvas（不会被污染）
  try{
   const img=await new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';const t=setTimeout(()=>reject(Error('头像加载超时')),12000);i.onload=()=>{clearTimeout(t);resolve(i)};i.onerror=()=>{clearTimeout(t);reject(Error('头像无法读取'))};i.src=url;});
   const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);return {data:c.toDataURL('image/png'),area:img.naturalWidth*img.naturalHeight};
  }catch(e){throw e;}
 }
 const urls=[url];
 if(/^https:\/\/[^/]+\.douyinpic\.com\/aweme\/100x100\//.test(url))urls.push(url.replace('/aweme/100x100/','/aweme/720x720/'));
 const work=Promise.allSettled(urls.map(candidate)).then(results=>{const good=results.filter(r=>r.status==='fulfilled').map(r=>r.value).sort((a,b)=>b.area-a.area);if(!good.length)throw Error('头像下载失败，将重试');return good[0].data;});
 imageCache.set(url,work);work.catch(()=>imageCache.delete(url));
 if(imageCache.size>256)imageCache.delete(imageCache.keys().next().value);return work;
}
async function poll(){
 if(polling)return;polling=true;
 try{
  const [tasks,stats]=await Promise.all([api('/api/events'),api('/api/stats')]);
  count=stats.count;$('count').textContent=count;
  serverWaiting=tasks.filter(t=>!seen.has(String(t.id))).reduce((n,t)=>n+Number(t.count||1),0);renderQueue();updateScreen();
  const batch=tasks.slice().sort((a,b)=>Number(b.event==='gift')-Number(a.event==='gift')).slice(0,24);
  const loaded=await Promise.allSettled(batch.map(async task=>seen.has(String(task.id))?null:loadAvatar(task.avatarUrl)));
  let failures=0;
  for(let i=0;i<batch.length;i++){
   const task=batch[i],id=String(task.id);
   if(!seen.has(id)){
    if(loaded[i].status==='rejected'){failures++;continue;}
    const jobs=expandTask({...task,avatarUrl:loaded[i].value});insertTasks(queue,jobs);seen.add(id);serverWaiting-=jobs.length;
    renderQueue();updateScreen();next();
   }
   await api('/api/ack?id='+encodeURIComponent(id),'POST');
  }
  $('status').textContent=failures?'有 '+failures+' 个头像暂未加载，将自动重试':'本机接口已连接 · 易语言任务接收中';
 }catch(e){$('status').textContent=e.message;}finally{polling=false;}
}
function fallbackAvatar(name){
 const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#a8cbb9';x.fillRect(0,0,512,512);x.fillStyle='#44586b';x.beginPath();x.arc(256,180,80,0,7);x.fill();x.beginPath();x.ellipse(256,440,170,150,0,0,7);x.fill();return c.toDataURL();
}
$('currentImg').src=fallbackAvatar('');
$('demo').onclick=()=>{
 const jobs=expandTask({id:'demo-'+Date.now(),nickname:'测试观众',avatarUrl:fallbackAvatar(''),event:'entry',count:1,size:1});jobs.forEach(j=>j.demo=true);insertTasks(queue,jobs);renderQueue();next();
};
$('toggle').onclick=()=>{paused=!paused;$('toggle').textContent=paused?'继续打印':'暂停打印';last=performance.now();if(!paused)next();};
$('speed').onchange=()=>simulationSpeed=Number($('speed').value);
$('capture').onclick=()=>{document.body.classList.add('scene-only');resize();};
window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('scene-only');resize();}});
window.avatarPrinterDebug=()=>({queue:queue.map(j=>({name:j.name,size:j.size,score:j.score,priority:j.priority})),active:active&&{name:active.name,score:active.score,size:active.size},phase,count,paused,products:products.length});
resize();renderQueue();updateScreen();requestAnimate();
// 仅在 HTTP 服务模式（有 token）下启动轮询；Electron 直接调用模式（window.enqueuePrint）不走 /api/*，避免 fetch 返回 HTML 导致 JSON 解析报错
if(token){
 poll();setInterval(poll,300);setInterval(flushCompletions,1000);
}else{
 $('status').textContent='Electron 直连模式 · 等待 window.enqueuePrint 投递任务';
 // 恢复今日业绩计数
 try{
  const day=localDay();
  const savedDay=localStorage.getItem('avatar3d-count-day');
  if(savedDay===day){count=Number(localStorage.getItem('avatar3d-count-'+day))||0;}
  else{count=0;localStorage.setItem('avatar3d-count-day',day);}
  $('count').textContent=count;updateScreen();
 }catch(_){}
}
